# JUnit configuration of the Keel Java binding tests.
# SafetyGuardExtension keeps every test on the simulator; it is registered through META-INF/services.
junit.jupiter.extensions.autodetection.enabled=true
# No test may hang a build: each one gets two minutes.
junit.jupiter.execution.timeout.default=2 m
