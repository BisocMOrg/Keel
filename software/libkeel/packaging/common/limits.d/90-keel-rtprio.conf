# libkeel runs its motor PWM worker thread at SCHED_FIFO priority 40
# (KEEL_RT_PRIORITY); without this limit it falls back to best-effort timing
# and reports KEEL_OPEN_WARN_BEST_EFFORT_TIMING. 40 stays below the threaded
# interrupt handlers (priority 50), so the worker never delays GPIO, I2C or
# storage interrupts. pam_limits applies this to login sessions only;
# systemd services set LimitRTPRIO=40 instead (see keel-app.service).
@keel - rtprio 40
