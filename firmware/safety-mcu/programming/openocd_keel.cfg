# openocd_keel.cfg -- Keel R3 baseboard: program the safety MCU
# U12 (STM32C011F4P6, DEV_ID 0x443) from the Raspberry Pi header through SW5.
#
# Wiring (R3):  Pi BCM0 / hdr 27 -> 1k -> SW5.2 -> SAFETY_SWDIO -> U12.18 PA13
#               Pi BCM1 / hdr 28 -> 1k -> SW5.1 -> SAFETY_SWCLK -> U12.19 PA14-BOOT0
#               Pi BCM7 / hdr 26 -> 1k -> SW5.3 -> SAFETY_NRST  -> U12.6  PF2-NRST
#               SW5.4: PROG_N -> GND (watchdog U13 WD_EN low, permits clamped by BAT54C)
#
# Requires the Raspberry Pi OS build of OpenOCD, or the verified pinned
# raspberrypi/openocd build documented in ../README.md. Upstream/Debian 0.12.0 has no STM32C0 flash support
# (added upstream 2023-05-24, "flash/stm32l4x: support STM32C0x devices") and
# Debian trixie's 0.12.0-3 is built without linuxgpiod.
#
# Usage (flash_safety_mcu.sh does this for you):
#   openocd -c "set KEEL_GPIOCHIP 0" -f openocd_keel.cfg \
#           -c "init" -c "keel_probe" -c "shutdown"

# ---------------------------------------------------------------- adapter ----
if { ![info exists KEEL_GPIOCHIP] } {
	# Pi 4 (pinctrl-bcm2711) and Pi 5 on kernels >= 6.6.45 (pinctrl-rp1) are chip 0.
	set KEEL_GPIOCHIP 0
}

adapter driver linuxgpiod

# SWD lines. SWDIO: Pi-side pull-up while OpenOCD reads (target also has one,
# DS13866 Table 12 note 2). SWCLK: no bias; OpenOCD drives it continuously.
adapter gpio swdio -chip $KEEL_GPIOCHIP 0 -pull-up
adapter gpio swclk -chip $KEEL_GPIOCHIP 1 -pull-none

# NRST: OPEN-DRAIN, active low. SAFETY_NRST is also wired to the open-drain fault
# bus through R31 1k; a push-pull HIGH would fight WDO/FAULT and park NRST
# at ~1.8 V (between VIL 0.99 V and VIH 2.31 V). Never change this to push-pull.
# 'adapter gpio' does not accept a drive option for srst; the open-drain mode
# comes from 'reset_config ... srst_open_drain' below (adapter.c keeps the srst
# gpio drive in sync with reset_config), realised by gpiolib open-drain emulation
# (line switched to input for "high").
adapter gpio srst -chip $KEEL_GPIOCHIP 7 -active-low -pull-up -init-inactive

transport select swd

# No network servers: this config is only driven by the script.
gdb_port disabled
telnet_port disabled
tcl_port disabled

# ----------------------------------------------------------------- target ----
# The packaged stm32c0x.cfg matches the packaged binary's command syntax.
source [find target/stm32c0x.cfg]

# Override the target file's reset setup: hardware reset through BCM7, debug
# port usable while NRST is low, connect under reset (the firmware may have
# started IWDG with DBG_IWDG_STOP cleared, see ../src/firmware.c main()).
reset_config srst_only srst_nogate connect_assert_srst srst_open_drain
# NRST edge: ~1.4 us fall through 1k; release rise to 0.7*VDD in <= 14 us
# (47k || RPU 25-55k || 23k with C29 1 nF). Both are far inside these values.
adapter srst pulse_width 10
adapter srst delay 100

# linuxgpiod has no speed control (it runs as fast as the GPIO ioctls allow,
# ~100 kHz class on a Pi 4); the 1k series parts support > 1 MHz.

# -------------------------------------------------------------- helpers -----
set KEEL_FLASH_BASE 0x08000000
set KEEL_FLASH_END  0x08004000   ;# STM32C011F4: 16 KB main flash
set KEEL_DBG_IDCODE 0x40015800
set KEEL_FLASH_ACR  0x40022000
set KEEL_FLASH_OPTR 0x40022020
set KEEL_FLASHSIZE  0x1FFF75A0
set KEEL_RCC_APBENR1 0x4002103C
# RCC_CSR2 (RCC base 0x40021000 + 0x60, stm32c011xx.h): reset flags.
#   RMVF bit 23 (write 1 clears the flags), PINRSTF bit 26, IWDGRSTF bit 29.
set KEEL_RCC_CSR2   0x40021060
set KEEL_RMVF       0x00800000
set KEEL_PINRSTF    0x04000000
set KEEL_IWDGRSTF   0x20000000
# OPTR bit 22 RAM_PARITY_CHECK=1 disables SRAM parity, preserving the
# reset-persistent sensor strike record. OPTR bits 24..28: nBOOT_SEL=1, nBOOT1=1, nBOOT0=1, NRST_MODE=11
#   -> boot main flash regardless of PA14-BOOT0 (shared with SWCLK), NRST
#      bidirectional (the firmware refuses to run otherwise).
set KEEL_OPTR_MASK  0x1F400000
set KEEL_OPTR_WANT  0x1F400000
set KEEL_OPTR_FINAL_MASK 0x1F4000FF
set KEEL_OPTR_FINAL_WANT 0x1F4000AA

proc keel_log {msg} {
	echo "KEEL: $msg"
}

proc keel_rd32 {addr} {
	return [expr {[lindex [read_memory $addr 32 1] 0] & 0xFFFFFFFF}]
}

proc keel_halt_under_reset {} {
	global KEEL_RCC_APBENR1
	reset halt
	# DBGMCU clock (RCC_APBENR1.DBGEN) is cleared by the reset.
	mmw $KEEL_RCC_APBENR1 0x08000000 0
}

# SW5 pole-4 interlock (watchdog disabled?). While the core is halted nothing
# kicks WDI. If U13 is still enabled (pole 4 OFF), WDO pulses MOTOR_FAULT low
# within 181 ms and R31 pulls SAFETY_NRST low, which latches RCC_CSR2.PINRSTF.
# Returns "" if no reset was seen, else the reason.
proc keel_interlock {} {
	global KEEL_RCC_CSR2 KEEL_RMVF KEEL_PINRSTF KEEL_IWDGRSTF
	mmw $KEEL_RCC_CSR2 $KEEL_RMVF 0   ;# clear reset flags (our own NRST reset)
	sleep 400                                  ;# > 2 x (153.6 ms frame + 27.5 ms WDO)
	set f [keel_rd32 $KEEL_RCC_CSR2]
	if {$f & $KEEL_IWDGRSTF} {
		return [format "IWDG reset while halted (RCC_CSR2=0x%08x; OPTR IWDG_SW=0?). All FOUR SW5 poles must be ON (PROG)" $f]
	}
	if {$f & $KEEL_PINRSTF} {
		return [format "NRST pulsed while halted (RCC_CSR2=0x%08x): U13 watchdog running or MOTOR_FAULT low. All FOUR SW5 poles must be ON (PROG), including pole 4" $f]
	}
	return ""
}

# Identify the device. Prints "KEEL: PROBE OK ..." only if the SWD link
# answers, the SW5 pole-4 interlock passes AND the part is an STM32C011
# (DEV_ID 0x443).
proc keel_probe {} {
	global KEEL_DBG_IDCODE KEEL_FLASH_OPTR KEEL_FLASHSIZE
	if {[catch {keel_halt_under_reset} err]} {
		keel_log "PROBE FAIL: no SWD response ($err)"
		return
	}
	if {[catch {set why [keel_interlock]} err]} {
		keel_log "PROBE FAIL: interlock check could not read RCC_CSR2 ($err)"
		return
	}
	if {$why ne ""} {
		keel_log "PROBE FAIL: $why"
		return
	}
	if {[catch {
		set idc  [keel_rd32 $KEEL_DBG_IDCODE]
		set optr [keel_rd32 $KEEL_FLASH_OPTR]
		set fkb  [expr {[keel_rd32 $KEEL_FLASHSIZE] & 0xFFFF}]
	} err]} {
		keel_log "PROBE FAIL: memory access error ($err)"
		return
	}
	set devid [expr {$idc & 0xFFF}]
	set rev   [expr {($idc >> 16) & 0xFFFF}]
	keel_log [format "DEV_ID=0x%03x REV_ID=0x%04x FLASH_KB=%d OPTR=0x%08x" $devid $rev $fkb $optr]
	if {$devid != 0x443} {
		keel_log [format "PROBE FAIL: DEV_ID 0x%03x is not STM32C011 (0x443)" $devid]
		return
	}
	if {[catch {flash probe 0} err]} {
		keel_log "PROBE FAIL: flash driver does not know this part ($err)"
		return
	}
	keel_log [format "PROBE OK optr=0x%08x flash_kb=%d" $optr $fkb]
}

# Enforce the boot/reset option bits. Never touches RDP; refuses unless RDP is
# level 0 (0xAA). Option-byte reload (OBL_LAUNCH) resets the MCU.
proc keel_fix_optr {} {
	global KEEL_FLASH_OPTR KEEL_OPTR_MASK KEEL_OPTR_WANT
	global KEEL_OPTR_FINAL_MASK KEEL_OPTR_FINAL_WANT
	keel_halt_under_reset
	flash probe 0
	set optr [keel_rd32 $KEEL_FLASH_OPTR]
	if {($optr & 0xFF) != 0xAA} {
		keel_log [format "OPTR FAIL: RDP byte 0x%02x is not level 0 (0xAA); not touching it" [expr {$optr & 0xFF}]]
		return
	}
	if {($optr & $KEEL_OPTR_MASK) == $KEEL_OPTR_WANT} {
		keel_log [format "OPTR OK 0x%08x" $optr]
		return
	}
	# Re-check the SW5 pole-4 interlock immediately before the option-byte write: a watchdog reset inside the
	# ~25-45 ms OPTR programming window can corrupt the option bytes, the one step here that can brick the part.
	set why [keel_interlock]
	if {$why ne ""} {
		keel_log "OPTR FAIL: not writing option bytes: $why"
		return
	}
	keel_log [format "OPTR 0x%08x -> setting nBOOT_SEL=1 nBOOT1=1 nBOOT0=1 NRST_MODE=3 RAM_PARITY_CHECK=1" $optr]
	set previous_optr $optr
	stm32l4x option_write 0 0x20 $KEEL_OPTR_WANT $KEEL_OPTR_MASK
	# OBL_LAUNCH reloads option bytes and resets the device; the link drops.
	catch {stm32l4x option_load 0}
	sleep 200
	keel_halt_under_reset
	set optr [keel_rd32 $KEEL_FLASH_OPTR]
	if {($optr & $KEEL_OPTR_FINAL_MASK) == $KEEL_OPTR_FINAL_WANT &&
	    (($optr ^ $previous_optr) & (0xFFFFFFFF ^ $KEEL_OPTR_MASK)) == 0} {
		keel_log [format "OPTR OK 0x%08x" $optr]
	} else {
		keel_log [format "OPTR FAIL: 0x%08x after reload; required bits or preserved fields differ" $optr]
	}
}

# Undo the debug state left by the probe/program sequence (DHCSR.C_DEBUGEN and
# the stm32c0x.cfg examine-end DBG freeze bits survive every reset except
# power-on). Core must be running. DBGEN clock first, or the DBG writes drop.
proc keel_release_debug {} {
	mmw 0x4002103C 0x08000000 0      ;# RCC_APBENR1.DBGEN = 1
	mww 0x40015804 0                 ;# DBG_CR = 0 (DBG_STOP, DBG_STANDBY off)
	mww 0x40015808 0                 ;# DBG_APB_FZ1 = 0 (IWDG/WWDG run when halted)
	mww 0xE000EDF0 0xA05F0000        ;# DHCSR: key, C_DEBUGEN = 0, C_HALT = 0
}

# Program + verify an Intel HEX, clear PROGEMPTY, reset, confirm main-flash boot
# and a healthy firmware start (no IWDG reset loop), then release debug.
proc keel_program {hexfile} {
	global KEEL_FLASH_ACR KEEL_FLASH_BASE KEEL_FLASH_END
	global KEEL_RCC_CSR2 KEEL_RMVF KEEL_IWDGRSTF
	global KEEL_FLASH_OPTR KEEL_OPTR_FINAL_MASK KEEL_OPTR_FINAL_WANT
	keel_halt_under_reset
	if {[catch {flash write_image erase $hexfile 0 ihex} err]} {
		keel_log "PROGRAM FAIL: $err"
		return
	}
	keel_log "PROGRAM OK"
	if {[catch {verify_image $hexfile 0 ihex} err]} {
		keel_log "VERIFY FAIL: $err"
		return
	}
	keel_log "VERIFY OK"
	# A factory-blank part latched FLASH_ACR.PROGEMPTY (bit 16) at option-byte
	# load; clear it so this reset boots main flash, not the system bootloader.
	mmw $KEEL_FLASH_ACR 0 0x00010000
	# Clear the reset flags so an IWDG reset after start-up is visible. A
	# firmware that fails its self-test never feeds the IWDG (PR=0, RLR=2047:
	# 256 ms) and resets in a loop; 1000 ms covers several periods.
	mmw $KEEL_RCC_CSR2 $KEEL_RMVF 0
	reset run
	sleep 1000
	if {[catch {set csr2 [keel_rd32 $KEEL_RCC_CSR2]} err]} {
		keel_log "BOOT FAIL: could not read RCC_CSR2 ($err)"
		return
	}
	if {$csr2 & $KEEL_IWDGRSTF} {
		keel_log [format "BOOT FAIL: firmware self-test failed (IWDG reset loop), RCC_CSR2=0x%08x" $csr2]
		return
	}
	# Brief halt to prove the core runs from main flash, then let it go.
	# (Short: firmware's IWDG keeps counting while halted, 256 ms timeout.)
	if {[catch {halt 100; set pcs [reg pc]; resume} err]} {
		keel_log "BOOT FAIL: could not sample PC ($err)"
		return
	}
	if {![regexp {0x([0-9a-fA-F]+)} $pcs -> pchex]} {
		keel_log "BOOT FAIL: unparsable PC '$pcs'"
		return
	}
	set pc [expr 0x$pchex]
	if {$pc >= $KEEL_FLASH_BASE && $pc < $KEEL_FLASH_END} {
		keel_log [format "BOOT OK pc=0x%08x (main flash)" $pc]
	} else {
		keel_log [format "BOOT FAIL: pc=0x%08x is not in main flash" $pc]
	}
	# Fresh read AFTER option reload, programming and reset. Do not use the
	# initial probe value: a virgin MCU can have different option defaults.
	set final_optr [keel_rd32 $KEEL_FLASH_OPTR]
	if {($final_optr & $KEEL_OPTR_FINAL_MASK) != $KEEL_OPTR_FINAL_WANT} {
		keel_log [format "FINAL OPTR FAIL 0x%08x" $final_optr]
		return
	}
	keel_log [format "FINAL OPTR OK 0x%08x" $final_optr]
	# Last step: the core is running again, release the debug state.
	if {[catch {keel_release_debug} err]} {
		keel_log "DEBUG RELEASE FAIL: $err (power-cycle clears it)"
	} else {
		keel_log "DEBUG RELEASED"
	}
}
